# Watch ggml-org/whisper.cpp and start the RealTimeX whisper addon release.
#
# Hourly checks run outside GitHub, from the RealTimeX heartbeat on the iMac
# (agent-heartbeat workspace, task whisper-cpp-release-watch): GitHub throttles
# scheduled workflows on forks, and this one once went a month without a
# scheduled run. This cron is a daily backstop.
#
# Both paths run realtimex/scripts/watch_upstream.py, which decides: dispatch a
# new run, re-run only the failed jobs of the last run (after a backoff), or do
# nothing. Failed attempts are capped per packaging commit, so a broken build
# does not retry forever.
#
# Off switch: disable this workflow to pause every automatic release,
# including the heartbeat.
name: RealTimeX Watch Upstream

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      act:
        description: "Start or re-run the release when the watcher says so"
        required: false
        default: true
        type: boolean
      publish:
        description: "Let a manual check publish (false: a new run is a dry run and failed publish runs are not re-run)"
        required: false
        default: false
        type: boolean
      force_ref:
        description: "Optional upstream tag, branch, or SHA instead of the latest release"
        required: false
        default: ""
        type: string
      ignore_backoff:
        description: "Retry now even if the last failure is recent"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: realtimex-watch-upstream
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  watch:
    name: Check upstream whisper.cpp
    runs-on: ubuntu-22.04
    outputs:
      action: ${{ steps.watch.outputs.action }}
      reason: ${{ steps.watch.outputs.reason }}
      upstream_ref: ${{ steps.watch.outputs.upstream_ref }}
      release_tag: ${{ steps.watch.outputs.release_tag }}
      run_id: ${{ steps.watch.outputs.run_id }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            realtimex
          sparse-checkout-cone-mode: true

      - name: Compare upstream with the published addon
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          REALTIMEX_ELECTRON_RUNTIME_VERSION: ${{ vars.REALTIMEX_ELECTRON_RUNTIME_VERSION || '41.0.3' }}
          FORCE_REF: ${{ inputs.force_ref }}
          IGNORE_BACKOFF: ${{ inputs.ignore_backoff }}
        run: |
          set -euo pipefail
          args=(--packaging-repo "${GITHUB_REPOSITORY}" --force-ref "${FORCE_REF:-}" --github-output --json)
          if [ "${IGNORE_BACKOFF:-false}" = "true" ]; then
            args+=(--ignore-backoff)
          fi
          python3 realtimex/scripts/watch_upstream.py "${args[@]}"

  act:
    name: ${{ needs.watch.outputs.action }} ${{ needs.watch.outputs.release_tag }}
    needs: watch
    if: needs.watch.outputs.action != 'none' && (github.event_name == 'schedule' || inputs.act)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      ACTION: ${{ needs.watch.outputs.action }}
      UPSTREAM_REF: ${{ needs.watch.outputs.upstream_ref }}
      RELEASE_TAG: ${{ needs.watch.outputs.release_tag }}
      RUN_ID: ${{ needs.watch.outputs.run_id }}
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - name: Start or re-run the release
        run: |
          set -euo pipefail
          case "${ACTION}" in
            dispatch)
              gh workflow run realtimex-whisper-addon.yml \
                --repo "${GITHUB_REPOSITORY}" \
                -f "upstream_ref=${UPSTREAM_REF}" \
                -f "release_tag=${RELEASE_TAG}" \
                -f "publish=${PUBLISH}"
              echo "- Dispatched \`${UPSTREAM_REF}\` -> \`${RELEASE_TAG}\` (publish=${PUBLISH})" >> "$GITHUB_STEP_SUMMARY"
              ;;
            rerun-failed)
              if [ "${PUBLISH}" != "true" ]; then
                echo "- Run ${RUN_ID} publishes; re-run it with publish=true" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              gh run rerun "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --failed
              echo "- Re-running failed jobs of run ${RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Unknown watcher action '${ACTION}'"
              exit 1
              ;;
          esac
