# RealTimeX: build whisper_addon.node for Electron from a pinned
# ggml-org/whisper.cpp ref and publish it as the release assets the app
# downloads (realtimex-ai-app frontend/native/whisper-addon-pin.json).
#
# Rules (runbook: realtimex/README.md):
#   - Manual runs are dry runs unless publish=true.
#   - A published realtimex-* release is immutable. The app pins releases by
#     tag alone, so a rebuilt addon gets a new release_tag. The release is
#     assembled as a draft and published only when every platform is present;
#     the manifest is uploaded last.
#   - Every zip passes realtimex/scripts/validate_addon.py (format, CPU, macOS
#     floor, no exported weak node-addon-api symbols) and loads in Node.
#   - mac-arm64 tries a hosted runner first; if GitHub cannot place it, a
#     self-hosted fallback job builds it (REALTIMEX_MAC_ARM64_FALLBACK_RUNNER).
#   - If a platform still fails, re-run the failed jobs of the same run: the
#     other platforms' artifacts are reused. The watcher does this on its own,
#     with backoff.
name: RealTimeX Whisper Electron Addon
# realtimex/scripts/addon_release.py run_title() must match this.
run-name: >-
  RealTimeX Whisper Addon ${{ inputs.upstream_ref || 'latest-upstream' }}${{ inputs.release_tag && format(' -> {0}', inputs.release_tag) || '' }}${{ !inputs.publish && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "ggml-org/whisper.cpp tag, branch, or SHA. Empty uses the latest upstream release."
        required: false
        default: ""
        type: string
      release_tag:
        description: "Release tag to publish to. Empty uses realtimex-{upstream_ref}. Must not be published yet."
        required: false
        default: ""
        type: string
      publish:
        description: "Publish the release (false = dry run: build, gate and keep the artifacts only)"
        required: false
        default: false
        type: boolean
      mark_latest:
        description: "Mark the published release as this repository's Latest release"
        required: false
        default: false
        type: boolean
      mac_arm64_runner:
        description: "runs-on label for the mac-arm64 build. Empty uses the hosted macos-15; a self-hosted label can stand in when hosted macOS arm64 capacity is short."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Keyed by the release tag, defaulted like resolve-upstream does, so runs
  # for the same tag queue behind each other whether or not it was given.
  group: realtimex-whisper-addon-${{ inputs.release_tag || (inputs.upstream_ref && format('realtimex-{0}', inputs.upstream_ref)) || 'latest-upstream' }}
  cancel-in-progress: false

env:
  ELECTRON_RUNTIME_VERSION: ${{ vars.REALTIMEX_ELECTRON_RUNTIME_VERSION || '41.0.3' }}
  # The app's macOS floor (Electron 44 needs macOS 13).
  MACOS_DEPLOYMENT_TARGET: ${{ vars.REALTIMEX_MACOS_DEPLOYMENT_TARGET || '13.0' }}
  PYTHONUNBUFFERED: "1"

jobs:
  resolve-upstream:
    name: Resolve upstream
    runs-on: ubuntu-22.04
    outputs:
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            realtimex
            .github/workflows
          sparse-checkout-cone-mode: true

      - name: Test release scripts
        run: python3 -m unittest discover -s realtimex/tests -v

      - name: Resolve upstream ref
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_UPSTREAM_REF: ${{ inputs.upstream_ref }}
          RAW_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! [[ "${ELECTRON_RUNTIME_VERSION}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Invalid ELECTRON_RUNTIME_VERSION '${ELECTRON_RUNTIME_VERSION}'; set the repository variable REALTIMEX_ELECTRON_RUNTIME_VERSION, for example 41.0.3"
            exit 1
          fi
          if ! [[ "${MACOS_DEPLOYMENT_TARGET}" =~ ^[0-9]+[.][0-9]+$ ]]; then
            echo "::error::Invalid MACOS_DEPLOYMENT_TARGET '${MACOS_DEPLOYMENT_TARGET}'"
            exit 1
          fi
          upstream_ref="$(printf '%s' "${RAW_UPSTREAM_REF}" | tr -d '[:space:]')"
          if [ -z "$upstream_ref" ]; then
            upstream_ref="$(gh api repos/ggml-org/whisper.cpp/releases/latest --jq '.tag_name')"
          fi
          upstream_sha="$(gh api "repos/ggml-org/whisper.cpp/commits/${upstream_ref}" --jq '.sha')"
          release_tag="$(printf '%s' "${RAW_RELEASE_TAG}" | tr -d '[:space:]')"
          # The concurrency group is keyed by the raw inputs, which can't be
          # normalized in an expression: refuse inputs whose default tag would
          # differ from that key, so two runs for one tag always share a group.
          if [ "$RAW_UPSTREAM_REF" != "$upstream_ref" ] && [ -n "$RAW_UPSTREAM_REF" ] || [ "$RAW_RELEASE_TAG" != "$release_tag" ]; then
            echo "::error::upstream_ref and release_tag must not contain spaces"
            exit 1
          fi
          if [ -z "$release_tag" ] && [ -n "$RAW_UPSTREAM_REF" ] && [[ "$upstream_ref" == *[/:@]* ]]; then
            echo "::error::upstream_ref '${upstream_ref}' contains / : or @; pass release_tag explicitly"
            exit 1
          fi
          if [ -z "$release_tag" ]; then
            safe_upstream_ref="$(printf '%s' "$upstream_ref" | tr '/:@' '---')"
            release_tag="realtimex-${safe_upstream_ref}"
          fi
          if ! [[ "$release_tag" =~ ^realtimex-[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Release tag '${release_tag}' must look like realtimex-<name>"
            exit 1
          fi
          {
            echo "upstream_ref=${upstream_ref}"
            echo "upstream_sha=${upstream_sha}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved ggml-org/whisper.cpp ${upstream_ref} -> ${upstream_sha}; release ${release_tag}"

      - name: Refuse a published release tag
        # Fail before spending runner time; publish checks again before it writes.
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          UPSTREAM_SHA: ${{ steps.resolve.outputs.upstream_sha }}
        run: |
          python3 realtimex/scripts/release_state.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --electron-version "${ELECTRON_RUNTIME_VERSION}" \
            --upstream-sha "${UPSTREAM_SHA}" \
            --require-assemblable

  build:
    name: Build ${{ matrix.asset_os }}-${{ matrix.asset_arch }}
    needs: resolve-upstream
    strategy:
      fail-fast: false
      matrix:
        # mac-arm64 has its own jobs below (hosted, then the self-hosted fallback).
        include:
          - asset_os: mac
            asset_arch: x64
            node_arch: x64
            runner: macos-15-intel
          - asset_os: linux
            asset_arch: x64
            node_arch: x64
            runner: ubuntu-22.04
          - asset_os: linux
            asset_arch: arm64
            node_arch: arm64
            runner: ubuntu-24.04-arm
          - asset_os: win
            asset_arch: x64
            node_arch: x64
            runner: windows-2022
            msvc_arch: x64
            python: python
          - asset_os: win
            asset_arch: arm64
            node_arch: arm64
            runner: windows-11-arm
            msvc_arch: arm64
            python: python
            # windows-11-arm is now the windows-11-vs2026-arm64 image (VS 18
            # only). cmake-js 7.4.0 is the first release whose Visual Studio
            # finder knows VS 2026; 7.3.0 fails with "unknown version". The
            # other targets stay on 7.3.0 until they are verified on 7.4.0.
            cmake_js_version: "7.4.0"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout RealTimeX addon harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: packaging
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            realtimex
            .github/actions
          sparse-checkout-cone-mode: true

      - name: Build, gate and upload
        uses: ./packaging/.github/actions/whisper-addon
        with:
          asset_os: ${{ matrix.asset_os }}
          asset_arch: ${{ matrix.asset_arch }}
          node_arch: ${{ matrix.node_arch }}
          msvc_arch: ${{ matrix.msvc_arch }}
          python: ${{ matrix.python || 'python3' }}
          cmake_js_version: ${{ matrix.cmake_js_version || '7.3.0' }}
          upstream_ref: ${{ needs.resolve-upstream.outputs.upstream_ref }}
          upstream_sha: ${{ needs.resolve-upstream.outputs.upstream_sha }}
          electron_version: ${{ env.ELECTRON_RUNTIME_VERSION }}
          macos_deployment_target: ${{ env.MACOS_DEPLOYMENT_TARGET }}

  build-mac-arm64:
    name: Build mac-arm64
    needs: resolve-upstream
    # Hosted Apple Silicon runners are capacity-limited: GitHub cancels a job
    # it cannot place after about 15 minutes ("not acquired by Runner of type
    # hosted"). That cancellation starts build-mac-arm64-fallback. The
    # mac_arm64_runner input, else REALTIMEX_MAC_ARM64_RUNNER, picks another
    # runner for this job outright.
    runs-on: ${{ inputs.mac_arm64_runner || vars.REALTIMEX_MAC_ARM64_RUNNER || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - name: Checkout RealTimeX addon harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: packaging
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            realtimex
            .github/actions
          sparse-checkout-cone-mode: true

      - name: Build, gate and upload
        uses: ./packaging/.github/actions/whisper-addon
        with:
          asset_os: mac
          asset_arch: arm64
          node_arch: arm64
          upstream_ref: ${{ needs.resolve-upstream.outputs.upstream_ref }}
          upstream_sha: ${{ needs.resolve-upstream.outputs.upstream_sha }}
          electron_version: ${{ env.ELECTRON_RUNTIME_VERSION }}
          macos_deployment_target: ${{ env.MACOS_DEPLOYMENT_TARGET }}

  build-mac-arm64-fallback:
    name: Build mac-arm64 (fallback runner)
    needs:
      - resolve-upstream
      - build-mac-arm64
    # Only when the hosted job was cancelled (no runner), not when it failed:
    # a real build failure stays a failure. REALTIMEX_MAC_ARM64_FALLBACK_RUNNER
    # names the self-hosted label; empty turns the fallback off. A runner for it
    # is started on demand (realtimex/README.md, "Fallback runner").
    if: >-
      !cancelled()
      && needs.resolve-upstream.result == 'success'
      && needs.build-mac-arm64.result == 'cancelled'
      && vars.REALTIMEX_MAC_ARM64_FALLBACK_RUNNER != ''
    runs-on: ${{ vars.REALTIMEX_MAC_ARM64_FALLBACK_RUNNER }}
    timeout-minutes: 45
    steps:
      - name: Checkout RealTimeX addon harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: packaging
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            realtimex
            .github/actions
          sparse-checkout-cone-mode: true

      - name: Build, gate and upload
        uses: ./packaging/.github/actions/whisper-addon
        with:
          asset_os: mac
          asset_arch: arm64
          node_arch: arm64
          upstream_ref: ${{ needs.resolve-upstream.outputs.upstream_ref }}
          upstream_sha: ${{ needs.resolve-upstream.outputs.upstream_sha }}
          electron_version: ${{ env.ELECTRON_RUNTIME_VERSION }}
          macos_deployment_target: ${{ env.MACOS_DEPLOYMENT_TARGET }}

  publish:
    # Static: a skipped job shows its name unrendered.
    name: Publish release
    needs:
      - resolve-upstream
      - build
      - build-mac-arm64
      - build-mac-arm64-fallback
    if: >-
      !cancelled()
      && inputs.publish
      && needs.resolve-upstream.result == 'success'
      && needs.build.result == 'success'
      && (needs.build-mac-arm64.result == 'success' || needs.build-mac-arm64-fallback.result == 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve-upstream.outputs.release_tag }}
      UPSTREAM_REF: ${{ needs.resolve-upstream.outputs.upstream_ref }}
      UPSTREAM_SHA: ${{ needs.resolve-upstream.outputs.upstream_sha }}
      MARK_LATEST: ${{ inputs.mark_latest }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            realtimex
          sparse-checkout-cone-mode: true

      - name: Download addon artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: whisper-addon-*
          merge-multiple: true

      - name: Build release manifest
        run: |
          set -euo pipefail
          python3 realtimex/scripts/build_manifest.py \
            --dist-dir artifacts \
            --release-tag "${RELEASE_TAG}" \
            --electron-version "${ELECTRON_RUNTIME_VERSION}" \
            --upstream-ref "${UPSTREAM_REF}" \
            --upstream-sha "${UPSTREAM_SHA}" \
            --packaging-repo "${GITHUB_REPOSITORY}" \
            --packaging-sha "${GITHUB_SHA}" \
            --require-complete
          {
            echo "## RealTimeX whisper addon ${RELEASE_TAG}"
            echo ""
            echo '```json'
            jq '{releaseTag, electronRuntimeVersion, upstreamRef, upstreamSha, packagingSha, complete, assets: [.assets[] | {name, sha256}]}' artifacts/whisper-addon-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble draft release
        run: |
          set -euo pipefail
          # Re-check right before writing: published releases are immutable.
          state_json="$(python3 realtimex/scripts/release_state.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --electron-version "${ELECTRON_RUNTIME_VERSION}" \
            --upstream-sha "${UPSTREAM_SHA}" \
            --require-assemblable)"
          state="$(jq -r '.state' <<< "$state_json")"

          # GitHub ignores --target once the tag exists: a leftover tag would
          # publish this release at an older packaging commit.
          ref_err="$(mktemp)"
          if ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>"$ref_err")"; then
            tag_sha="$(jq -r '.object.sha' <<< "$ref_json")"
            if [ "$(jq -r '.object.type' <<< "$ref_json")" = "tag" ]; then
              tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
            fi
            if [ "$tag_sha" != "${GITHUB_SHA}" ]; then
              echo "::error::Tag ${RELEASE_TAG} already exists at ${tag_sha}, not this build's commit ${GITHUB_SHA}; use a new release_tag"
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$ref_err"; then
            # Only "no such tag" may pass; any other error fails closed.
            echo "::error::Could not check tag ${RELEASE_TAG}: $(cat "$ref_err")"
            exit 1
          fi

          title="RealTimeX Whisper Addon ${RELEASE_TAG}"
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          # ${title}

          - Electron runtime: \`${ELECTRON_RUNTIME_VERSION}\`
          - Upstream: [ggml-org/whisper.cpp \`${UPSTREAM_REF}\`](https://github.com/ggml-org/whisper.cpp/tree/${UPSTREAM_SHA}) (\`${UPSTREAM_SHA}\`)
          - Packaging: [\`${GITHUB_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA})
          - macOS floor: \`${MACOS_DEPLOYMENT_TARGET}\`
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Each zip passed \`realtimex/scripts/validate_addon.py\` and loaded in Node.
          Digests are in \`whisper-addon-manifest.json\`. This release is immutable:
          rebuilds are published under a new tag. The app picks a release through
          \`frontend/native/whisper-addon-pin.json\`.
          EOF

          if [ "$state" = "absent" ]; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file "$notes"
          else
            # A draft left by an earlier attempt: nobody can download it yet,
            # so it is safe to reuse and replace its assets.
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file "$notes"
            keep="$(cd artifacts && ls whisper-addon-*.zip whisper-addon-manifest.json)"
            gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' |
              while IFS= read -r name; do
                if ! grep -Fxq "$name" <<< "$keep"; then
                  gh release delete-asset "${RELEASE_TAG}" "$name" --repo "${GITHUB_REPOSITORY}" --yes
                fi
              done
          fi

          gh release upload "${RELEASE_TAG}" artifacts/whisper-addon-*.zip \
            --repo "${GITHUB_REPOSITORY}" --clobber
          # The manifest goes last, so it never lists a zip that is not there.
          gh release upload "${RELEASE_TAG}" artifacts/whisper-addon-manifest.json \
            --repo "${GITHUB_REPOSITORY}" --clobber

          expected="$(jq -r '.expectedAssetNames[]' artifacts/whisper-addon-manifest.json; echo whisper-addon-manifest.json)"
          actual="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          if [ "$(sort <<< "$expected")" != "$(sort <<< "$actual")" ]; then
            echo "::error::Draft ${RELEASE_TAG} assets do not match the manifest"
            diff <(sort <<< "$expected") <(sort <<< "$actual") || true
            exit 1
          fi

      - name: Publish release
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest="${MARK_LATEST}"
          for _ in 1 2 3 4 5 6; do
            if python3 realtimex/scripts/release_state.py \
                --repo "${GITHUB_REPOSITORY}" \
                --tag "${RELEASE_TAG}" \
                --electron-version "${ELECTRON_RUNTIME_VERSION}" \
                --upstream-sha "${UPSTREAM_SHA}" \
                --require-complete > release-state.json; then
              echo "Published ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          cat release-state.json
          echo "::error::${RELEASE_TAG} was published but does not read back as complete"
          exit 1
